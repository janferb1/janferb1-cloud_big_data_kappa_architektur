# =============================================================================
# Kappa Architecture – IoT Sensor Data Pipeline
# Docker Compose: Startet ALLE Komponenten der Kappa-Architektur
#
# Komponenten:
#   - broker:           Kafka (Ingestion Layer / Input Topic)
#   - streaming-server: Kafka Producer (liest CSV, sendet Messages)
#   - spark:            Spark Streaming + KMeans Clustering (Speed Layer)
#   - minio:            MinIO Object Store (Serving Layer)
#
# Start: docker compose up --build
# =============================================================================
version: "3.8"

services:

  # ---------------------------------------------------------------------------
  # Ingestion Layer: Apache Kafka Broker
  # Empfängt IoT-Sensor-Messages und stellt sie als Topic bereit
  # ---------------------------------------------------------------------------
  broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kappa_net

  # ---------------------------------------------------------------------------
  # Input Stream: Streaming Server (Kafka Producer)
  # Liest iot_sensor_data.csv und sendet Zeilen als Kafka-Messages
  # Implementiert den "Master Dataset Replay" der Kappa-Architektur
  # ---------------------------------------------------------------------------
  streaming-server:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    container_name: streaming-server
    depends_on:
      broker:
        condition: service_healthy
    environment:
      KAFKA_BROKER: broker:9092
      KAFKA_TOPIC: iot-sensor-topic
    volumes:
      - ./data:/app/data:ro
    networks:
      - kappa_net

  # ---------------------------------------------------------------------------
  # Speed Layer: Apache Spark Structured Streaming
  # Konsumiert Kafka-Topic, führt KMeans-Clustering durch,
  # schreibt strukturierte Ergebnisse als Parquet nach MinIO
  # ---------------------------------------------------------------------------
  spark:
    image: bitnami/spark:3.5
    container_name: spark-streaming
    depends_on:
      broker:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      KAFKA_BROKER: broker:9092
      KAFKA_TOPIC: iot-sensor-topic
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS: minioadmin
      MINIO_SECRET: minioadmin
      MINIO_BUCKET: iot-output
    volumes:
      - ./spark:/opt/spark-app
    command: >
      spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
      --conf spark.hadoop.fs.s3a.access.key=minioadmin
      --conf spark.hadoop.fs.s3a.secret.key=minioadmin
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.sql.shuffle.partitions=4
      /opt/spark-app/spark_streaming_app.py
    networks:
      - kappa_net

  # ---------------------------------------------------------------------------
  # Serving Layer: MinIO Object Store (S3-kompatibel)
  # Speichert geclusterte Sensor-Daten als Parquet-Dateien
  # Web Console: http://localhost:9001  (minioadmin / minioadmin)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-Console
    volumes:
      - minio_data:/data
    networks:
      - kappa_net

  # ---------------------------------------------------------------------------
  # MinIO Bucket Setup: Erstellt den Output-Bucket beim Start
  # ---------------------------------------------------------------------------
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/iot-output;
      echo 'Bucket iot-output created';
      "
    networks:
      - kappa_net

volumes:
  minio_data:

networks:
  kappa_net:
    driver: bridge
