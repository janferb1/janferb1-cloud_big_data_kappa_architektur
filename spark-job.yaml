# Spark Streaming Job (Speed Layer)
# Run with: kubectl apply -f spark-job.yaml -n kappa-iot
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-iot-streaming
  namespace: kappa-iot
spec:
  template:
    spec:
      serviceAccountName: spark
      restartPolicy: OnFailure
      containers:
        - name: spark-driver
          image: apache/spark:3.5.0
          command:
            - /bin/bash
            - -c
            - |
              pip install numpy --target=/tmp/pypackages &&
              export PYTHONPATH=/tmp/pypackages:$PYTHONPATH &&
              /opt/spark/bin/spark-submit \
                --master local[2] \
                --conf spark.jars.ivy=/tmp/.ivy2 \
                --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4 \
                /opt/spark-app/spark_streaming_app.py
          env:
            - name: KAFKA_BROKER
              value: "kafka-service:9092"
            - name: KAFKA_TOPIC
              value: "iot-sensor-topic"
            - name: MINIO_ENDPOINT
              value: "http://minio-service:9000"
            - name: MINIO_ACCESS
              value: "minioadmin"
            - name: MINIO_SECRET
              value: "minioadmin"
            - name: MINIO_BUCKET
              value: "iot-output"
          volumeMounts:
            - name: spark-app
              mountPath: /opt/spark-app
            - name: tmp-storage
              mountPath: /tmp
      volumes:
        - name: spark-app
          configMap:
            name: spark-app-config
        - name: tmp-storage
          emptyDir: {}