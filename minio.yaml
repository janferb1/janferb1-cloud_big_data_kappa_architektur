# MinIO Deployment (Serving Layer / Object Store)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: kappa-iot
spec:
  replicas: 1
  selector:
    matchLabels:
      pod: minio-pod
  template:
    metadata:
      labels:
        pod: minio-pod
    spec:
      containers:
        - name: minio-container
          image: minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000  # S3 API
            - containerPort: 9001  # Web Console
          volumeMounts:
            - name: minio-storage
              mountPath: /data
      volumes:
        - name: minio-storage
          emptyDir: {}   # Use PersistentVolume in production
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: kappa-iot
spec:
  selector:
    pod: minio-pod
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: NodePort  # Minikube: access via minikube service minio-service -n kappa-iot
